[env]
CMAKE_CXX_COMPILER_LAUNCHER = "sccache"
CMAKE_C_COMPILER_LAUNCHER = "sccache"

[settings]
lockfile = true

# clang ツールは OS 由来のツール (CI: ubuntu:24.04 apt の clang-format 18.1.3 /
# 手元: 26.04 の LLVM 21) とフォーマット結果が変わるため、conda バックエンドで固定
# (clang-format は conda-forge に 18.1.8 / 21.x、clang-tidy は conda:clang-tools に 20.1.0 以降のみ存在)
[tool_alias]
clang-format = "conda:clang-format"
clang-tools = "conda:clang-tools"

[tools]
just = "latest"
sccache = "latest"
clang-format = "21.1.8"
clang-tools = "21.1.8"

[tasks.generate_proto]
description = "Generate C++ protobuf code"
run = ["buf generate --clean"]
sources = ["buf.gen.yaml", "../utils/proto"]

[tasks.deps]
description = "Install dependencies and generate code"
depends = ["generate_proto"]
run = "just deps"
sources = ["CMakeLists.txt", "src/**/*.cpp", "include/**/*/hpp"]
outputs = ["./build/build.ninja", "./build/compile_commands.json"]

[tasks.build]
depends = ["deps"]
description = "Compile C++ applications (processor, viewer)"
run = "just build"
sources = [
  "./build/build.ninja",
  "./build/compile_commands.json",
  "include/**/*.hpp",
  "src/**/*.cpp"
]
outputs = ["./build/processor", "./build/viewer"]

[tasks.lint]
description = "Run C++ linters (clang-tidy) and format checks"
run = [{ tasks = ["clang_tidy", "format_check"] }]

[tasks.clang_tidy]
depends = ["deps"]
description = "Run static analysis with clang-tidy"
run = "just clang-tidy"

[tasks.format_check]
depends = ["deps"]
description = "Verify if C++ code follows the clang-format style"
run = "just format-check"

[tasks.format]
depends = ["deps"]
description = "Automatically format C++ code using clang-format"
run = "just format"

[tasks.start]
depends = ["build"]
description = "Execute Processor application"
run = "./build/processor"

[tasks.test]
depends = ["build"]
description = "Execute C++ unit tests"
run = "just test"
