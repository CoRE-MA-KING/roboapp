monorepo_root = true

[monorepo]
config_roots = [
  "./lidar_system/",
  "./main_camera_system/",
  "./uart_bridge/",
  "./ui_system/",
]

[settings]
experimental = true
task.monorepo_depth = 2
lockfile = true

[tools]
buf = "latest"
"github:jdx/jactionlint" = "latest"
markdownlint-cli2 = "latest"
node = "lts"
ruff = "latest"
uv = "0.13"
yamlfmt = "latest"

[tasks.init]
description = "Install system dependencies and bootstrap the project"
run = """
if [ -d ".git" ]; then
	echo "Cloning Submodules"
	git submodule update --init --recursive
fi

echo "Install Dependencies"
sudo mkdir -p /etc/apt/keyrings
if [ ! -f "/etc/apt/keyrings/zenoh-public-key.gpg" ]; then
	curl -L https://download.eclipse.org/zenoh/debian-repo/zenoh-public-key | sudo gpg --dearmor --yes --output /etc/apt/keyrings/zenoh-public-key.gpg
fi

if [ ! -f "/etc/apt/sources.list.d/zenoh.list" ]; then
	echo "deb [signed-by=/etc/apt/keyrings/zenoh-public-key.gpg] https://download.eclipse.org/zenoh/debian-repo/ /" | sudo tee /etc/apt/sources.list.d/zenoh.list >/dev/null
fi

sudo apt-get update

# Common
sudo apt-get install -y \
	build-essential cmake ninja-build \
	libzenohc=1.6.2 libzenohc-dev=1.6.2 libzenohcpp-dev=1.6.2 zenohd

sudo apt-mark hold libzenohc libzenohc-dev libzenohcpp-dev zenohd

if [ "$(command -v systemctl)" ]; then
	sudo systemctl disable zenohd --now
fi
# UI System
sudo apt-get install -y \
	libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
	libayatana-appindicator3-dev librsvg2-dev clang libclang-dev llvm llvm-dev

# Main Camera System
sudo apt-get install -y \
	nasm

# Lidar System
sudo apt-get install -y \
	libgflags-dev libopencv-dev nlohmann-json3-dev \
	clang-tidy clang-format \
	libprotobuf-dev libprotobuf-c-dev protobuf-compiler

# UART Bridge
sudo apt-get install -y \
	socat
"""

[tasks.generate_proto]
description = "Generate protobuf code across all components"
depends = [
  "//uart_bridge:generate_proto",
  "//ui_system:generate_proto",
  "//lidar_system:generate_proto",
]

[tasks.action_lint]
description = "Perform static analysis on GitHub Actions workflow files using jactionlint and yamlfmt"
run = ["yamlfmt -lint .github", "jactionlint --profile correctness"]

[tasks.action_format]
description = "Automatically format GitHub Actions workflow files using yamlfmt"
run = "yamlfmt .github"

[tasks.markdown_lint]
description = "Lint all Markdown files in the repository, excluding environment and build directories"
run = 'markdownlint-cli2 "**/*.md" "#**/.venv" "#**/node_modules" "#**/target" "#**/build" "#**/3rdparty"'

[tasks.markdown_format]
description = "Automatically format and fix issues in all Markdown files"
run = 'markdownlint-cli2 "**/*.md" "#**/.venv" "#**/node_modules" "#**/target" "#**/build" "#**/3rdparty" --fix'

[tasks.build]
description = "Build all sub-projects (camera, uart, ui, lidar) in the correct order"
depends = [
  "//main_camera_system:build",
  "//uart_bridge:build",
  "//ui_system:build",
  "//lidar_system:build",
]

[tasks.lint]
description = "Run all linters (code, markdown, actions) across the entire monorepo"
depends = [
  "//main_camera_system:lint",
  "//uart_bridge:lint",
  "//ui_system:lint",
  "//lidar_system:lint",
  "//:markdown_lint",
  "//:action_lint",
]

[tasks.format]
description = "Run all formatters across the entire monorepo to ensure consistent code style"
depends = [
  "//main_camera_system:format",
  "//uart_bridge:format",
  "//ui_system:format",
  "//lidar_system:format",
  "//:markdown_format",
  "//:action_format",
]

[tasks.test]
description = "Run all unit and integration tests for all sub-projects"
depends = [
  "//main_camera_system:test",
  "//uart_bridge:test",
  "//ui_system:test",
  "//lidar_system:test",
]
