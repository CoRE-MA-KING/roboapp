monorepo_root = true

[monorepo]
config_roots = [
  "./lidar_system/",
  "./main_camera_system/",
  "./uart_bridge/",
  "./ui_system/",
]

[settings]
experimental = true
task.monorepo_depth = 2
lockfile = true

[tools]
buf = "latest"
"github:jdx/jactionlint" = "latest"
rumdl = "latest"
yamlfmt = "latest"

[bootstrap.apt.sources.zenoh]
uris = "https://download.eclipse.org/zenoh/debian-repo/"
suites = "/"
key = "https://download.eclipse.org/zenoh/debian-repo/zenoh-public-key"
fingerprint = "0ABC5913672BBE50921B3B9395D19EA1F7DF9E8E"

[bootstrap.packages]
# Common
"apt:build-essential" = "latest"
"apt:cmake" = "latest"
"apt:ninja-build" = "latest"
"apt:libzenohc" = "1.6.2"
"apt:libzenohc-dev" = "1.6.2"
"apt:libzenohcpp-dev" = "1.6.2"
"apt:zenohd" = "latest"
# UI System
"apt:libwebkit2gtk-4.1-dev" = "latest"
"apt:file" = "latest"
"apt:libxdo-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:libayatana-appindicator3-dev" = "latest"
"apt:librsvg2-dev" = "latest"
# libclang (runtime) is required by bindgen (v4l2-sys-mit in
# main_camera_system). Neither the clang compiler nor llvm-dev is needed:
# C/C++ is built with GCC from build-essential, and clang-tidy/clang-format
# ship their own binaries.
"apt:libclang1-18" = "latest"
# Main Camera System
"apt:nasm" = "latest"
# Lidar System
"apt:libgflags-dev" = "latest"
"apt:libopencv-dev" = "latest"
"apt:nlohmann-json3-dev" = "latest"
"apt:clang-tidy" = "latest"
"apt:clang-format" = "latest"
"apt:libprotobuf-dev" = "latest"
"apt:libprotobuf-c-dev" = "latest"
"apt:protobuf-compiler" = "latest"
# UART Bridge
"apt:socat" = "latest"

[bootstrap.services.zenohd]
state = "stopped"
enabled = false

[tasks.submodules]
description = "Initialize and update git submodules"
run = """
if [ -e .git ]; then
	echo "Cloning Submodules"
	git submodule update --init
fi
"""

[tasks.bootstrap]
description = "System and project bootstrap setup"
depends = ["submodules"]
run = """
# sudo apt-mark hold libzenohc libzenohc-dev libzenohcpp-dev zenohd
"""

[tasks.init]
description = "Alias for mise bootstrap"
run = "mise bootstrap"

[tasks.generate_proto]
description = "Generate protobuf code across all components"
depends = [
  "//uart_bridge:generate_proto",
  "//ui_system:generate_proto",
  "//lidar_system:generate_proto",
]

[tasks.action_lint]
description = "Perform static analysis on GitHub Actions workflow files using jactionlint and yamlfmt"
run = ["yamlfmt -lint .github", "jactionlint --profile correctness"]

[tasks.action_format]
description = "Automatically format GitHub Actions workflow files using yamlfmt"
run = "yamlfmt .github"

[tasks.markdown_lint]
description = "Lint all Markdown files in the repository using rumdl"
run = "rumdl check ."

[tasks.markdown_format]
description = "Automatically format and fix issues in all Markdown files using rumdl"
run = "rumdl fmt ."

[tasks.build]
description = "Build all sub-projects (camera, uart, ui, lidar) in the correct order"
depends = [
  "//main_camera_system:build",
  "//uart_bridge:build",
  "//ui_system:build",
  "//lidar_system:build",
]

[tasks.lint]
description = "Run all linters (code, markdown, actions) across the entire monorepo"
depends = [
  "//main_camera_system:lint",
  "//uart_bridge:lint",
  "//ui_system:lint",
  "//lidar_system:lint",
  "//:markdown_lint",
  "//:action_lint",
]

[tasks.format]
description = "Run all formatters across the entire monorepo to ensure consistent code style"
depends = [
  "//main_camera_system:format",
  "//uart_bridge:format",
  "//ui_system:format",
  "//lidar_system:format",
  "//:markdown_format",
  "//:action_format",
]

[tasks.test]
description = "Run all unit and integration tests for all sub-projects"
depends = [
  "//main_camera_system:test",
  "//uart_bridge:test",
  "//ui_system:test",
  "//lidar_system:test",
]
