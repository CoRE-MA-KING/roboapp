[env]
RUSTC_WRAPPER = "sccache"

[tools]
rust = { version = "1.91", components = "rust-analyzer" }
sccache = "latest"

[tasks.deps]
description = "Install dependencies and generate code"
run = "cargo fetch"

[tasks.build]
depends = ["deps"]
description = "Build the main-camera-system Rust application in release mode"
run = "cargo build --release"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "src/**",
]
outputs = ["./target/release/main-camera-system"]

[tasks.lint]
depends = ["deps"]
description = "Run Rust linter (clippy) and treat warnings as errors"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.format]
depends = ["deps"]
description = "Format Rust code using cargo fmt"
run = "cargo fmt --all"

[tasks.test]
depends = ["deps"]
description = "Execute Rust unit and integration tests"
run = "cargo test"

[tasks.start]
depends = ["build"]
description = "Run the compiled main-camera-system binary"
run = "./target/release/main-camera-system"
