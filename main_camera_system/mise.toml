[env]
RUSTC_WRAPPER = "sccache"

[tools]
rust = { version = "1.91", components = "rust-analyzer" }
sccache = "latest"
"cargo:protobuf-codegen" = "3.7"

[tasks.generate_proto]
description = "Generate Rust code from Protobuf files"
run = """
rm -f src/proto/*.rs
protoc \
  --plugin=protoc-gen-rust_protobuf=$(which protoc-gen-rs) \
  --rust_protobuf_out=src/proto \
  --proto_path=../utils/proto \
  $(find ../utils/proto -name "*.proto")
"""
sources = ["../utils/proto/**/*.proto"]
outputs = ["src/proto/*.rs"]

[tasks.deps]
depends = ["generate_proto"]
run = "cargo fetch"

[tasks.build]
depends = ["deps"]
description = "Build the main-camera-system Rust application in release mode"
run = "cargo build --release"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "src/**",
]
outputs = ["./target/release/main-camera-system"]

[tasks.lint]
depends = ["deps"]
description = "Run Rust linter (clippy) and treat warnings as errors"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.format]
depends = ["deps"]
description = "Format Rust code using cargo fmt"
run = "cargo fmt --all"

[tasks.test]
depends = ["deps"]
description = "Execute Rust unit and integration tests"
run = "cargo test"

[tasks.start]
depends = ["build"]
description = "Run the compiled main-camera-system binary"
run = "./target/release/main-camera-system"
