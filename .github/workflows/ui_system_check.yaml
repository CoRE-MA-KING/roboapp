name: UI System Check
on:
  pull_request:
    paths:
      - "ui_system/**"
      - ".github/workflows/ui_system_check.yaml"
env:
  CARGO_TERM_COLOR: always
  WORKDIR: ui_system
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
jobs:
  UI_System_Check_Rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}/src-tauri
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: ./.github/actions/mise
        with:
          workdir: ${{ env.WORKDIR }}
      - uses: ./.github/actions/rust
        with:
          workdir: ${{ env.WORKDIR }}/src-tauri
      - name: Install Dependencies
        run: |
          mise //:deps
          mise //${{ env.WORKDIR }}:deps
      - name: Lint
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Format
        run: |
          cargo fmt --all -- --check
      - name: Run Tests
        run: |
          cargo test --all-features -- --nocapture
  UI_System_Check_JS:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/mise
        with:
          workdir: ${{ env.WORKDIR }}
      - uses: ./.github/actions/nodejs
        with:
          workdir: ${{ env.WORKDIR }}
      - name: Install Dependencies
        run: |
          mise //:deps
          mise //${{ env.WORKDIR }}:deps_node
      - name: Typecheck
        run: |
          pnpm check
      - name: Lint
        run: |
          pnpm lint
