name: Build and Push CI Image
on:
  # Only publish `latest` from main. Building on every branch used to make
  # stacked PRs race on the same tag and never share a cache.
  push:
    branches:
      - main
    paths:
      - ".github/container/**"
      - ".github/workflows/build-image.yaml"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:
# Never run two image builds at once: they would overwrite each other's cache
# and `latest` tag.
concurrency:
  group: ci-image
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
      - name: Resolve lowercase image references
        id: refs
        # Registry references must be lowercase, but github.repository keeps the
        # owner's casing (CoRE-MA-KING). metadata-action lowercases the image
        # tags, but the buildx cache ref is passed through as-is.
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${repo}/ci-image" >> "$GITHUB_OUTPUT"
          echo "cache=${repo}/ci-image:buildcache" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.refs.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: .github/container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.refs.outputs.cache }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.refs.outputs.cache }},mode=max
