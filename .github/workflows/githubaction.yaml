name: GithubAction Check
on:
  pull_request:
    paths:
      - ".github/**/*.yaml"
jobs:
  GithubAction_Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          workdir: .
      - name: Install Dependencies
        run: |
          mise //:githubactionlint
