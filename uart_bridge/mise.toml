[tools]
uv = "0.9"

[tasks.generate_proto]
description = "Generate Python code from Protobuf files"
run = """
mkdir -p src/roboapp src/buf/validate
protoc \
  --python_out=src \
  --pyi_out=src \
  --proto_path=../utils/proto \
  $(find ../utils/proto -name "*.proto")
touch src/roboapp/__init__.py src/buf/__init__.py src/buf/validate/__init__.py
"""
sources = ["../utils/proto/**/*.proto"]
outputs = ["src/roboapp/*_pb2.py*", "src/buf/validate/*_pb2.py*"]

[tasks.deps]
description = "Install and sync Python dependencies using uv for uart_bridge"
depends = ["generate_proto"]
run = "uv sync"
sources = [
  "pyproject.toml",
  "uv.lock",
]
outputs = { auto = true }

[tasks.build]
depends = ["deps"]

[tasks.lint]
depends = ["build"]
description = "Run Python linters and type checkers for uart_bridge"
run = ["uv run task lint", "uv run task check"]

[tasks.format]
depends = ["build"]
description = "Format Python code in uart_bridge using ruff"
run = "uv run task format"

[tasks.test]
depends = ["build"]
description = "Execute Python tests for uart_bridge"
run = "uv run task test"

[tasks.start]
depends = ["build"]
description = "Start the uart_bridge application"
run = "uv run python3 src/uart_bridge/main.py"
