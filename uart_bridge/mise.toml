[tools]
python = "3.12"
uv = "0.13"

[settings]
lockfile = true

[tasks.generate_proto]
description = "Generate Python protobuf code using betterproto2"
# uv run syncs the project first and puts .venv/bin on PATH, so the
# betterproto2 compiler and ruff pinned in uv.lock are used.
run = ["uv run buf generate --clean"]
sources = ["buf.gen.yaml", "pyproject.toml", "uv.lock", "../utils/proto"]

[tasks.deps]
alias = "build"
description = "Install dependencies and generate code"
depends = ["generate_proto"]
run = "uv sync"
sources = [
  "pyproject.toml",
  "uv.lock",
]
outputs = { auto = true }

[tasks.lint]
depends = ["deps"]
description = "Run Python linters and type checkers for uart_bridge"
run = ["uv run task lint", "uv run task check"]

[tasks.format]
depends = ["deps"]
description = "Format Python code in uart_bridge using ruff"
run = "uv run task format"

[tasks.test]
depends = ["deps"]
description = "Execute Python tests for uart_bridge"
run = "uv run task test"

[tasks.start]
depends = ["deps"]
description = "Start the uart_bridge application"
run = "uv run python3 src/uart_bridge/main.py"
