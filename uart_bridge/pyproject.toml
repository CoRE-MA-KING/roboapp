[project]
name = "uart-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "motty", email = "motty.mio2@gmail.com" },
]
dependencies = [
  "betterproto>=1.2.5",
  "buf>=1.0.0",
  "eclipse-zenoh==1.6.2",
  "protobuf>=6.33.5",
  "protovalidate>=1.1.1",
  "pydantic>=2.11.7",
  "pyserial>=3.5",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.12.3",
  "taskipy>=1.14.1",
  "types-protobuf>=6.32.1.20251210",
  "types-pyserial>=3.5.0.20250326",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["uart_bridge.domain.proto.*"]
disable_error_code = ["type-arg"]
ignore_errors = true
ignore_missing_imports = true

[tool.ruff]
exclude = ["src/uart_bridge/domain/proto/"]

[tool.ruff.lint]
extend-select = ["I", "TC", "UP", "W"]

[tool.taskipy.tasks]
check = "mypy . --strict"
format = "ruff check . --fix && ruff format ."
lint = "ruff check ."
test = "pytest --cov --cov-report=html test/"
