[env]
RUSTC_WRAPPER = "sccache"

[tools]
node = "22"
pnpm = "10"
rust = { version = "1.91", components = "rust-analyzer" }
sccache = "latest"

[tasks.generate_proto]
description = "Generate TypeScript definitions from Protobuf files"
run = """
rm -f src/lib/types/proto/*.ts
protoc \
  --plugin=protoc-gen-ts_proto=./node_modules/.bin/protoc-gen-ts_proto \
  --ts_proto_out=src/lib/types/proto \
  --proto_path=../utils/proto \
  --ts_proto_opt=esModuleInterop=true \
  --ts_proto_opt=outputServices=false \
  $(find ../utils/proto -name "*.proto")
"""
sources = ["../utils/proto/roboapp/*.proto"]
outputs = ["src/lib/types/proto/*.ts"]

[tasks.deps_node]
description = "Install Node.js dependencies using pnpm"
run = "pnpm i"
depends = ["generate_proto"]
sources = ["package.json", "pnpm-lock.yaml"]
outputs = { auto = true }

[tasks.deps_rust]
description = "Fetch Rust dependencies for the Tauri backend"
dir = "src-tauri"
run = ["cargo fetch"]
sources = [
  "src-tauri/Cargo.toml",
  "src-tauri/Cargo.lock",
]
outputs = { auto = true }

[tasks.deps]
description = "Install all dependencies (Node.js and Rust) for the UI system"
depends = ["deps_node", "deps_rust"]

[tasks.build]
depends = ["deps"]
description = "Build the UI system (SvelteKit + Tauri) into a production binary"
run = "pnpm tauri build"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "src/**",
  "tsconfig*.json",
  "vite.config.*",
  "src-tauri/capabilities/**",
  "src-tauri/Cargo.toml",
  "src-tauri/Cargo.lock",
  "src-tauri/src/**",
  "src-tauri/tauri.conf.json",
  "src-tauri/icons/**",
]
outputs = ["./src-tauri/target/release/ui_system"]

[tasks.lint_node]
depends = ["deps_node"]
description = "Run ESLint and TypeScript checks for the frontend"
run = ["pnpm lint", "pnpm check"]

[tasks.lint_rust]
depends = ["deps_rust"]
description = "Run Rust linter (clippy) for the Tauri backend"
dir = "src-tauri"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint]
description = "Run all linters (frontend and backend) for the UI system"
depends = ["lint_node", "lint_rust"]

[tasks.format_node]
depends = ["deps_node"]
description = "Format frontend code using Prettier"
run = "pnpm format"

[tasks.format_rust]
depends = ["deps_rust"]
description = "Format Tauri backend Rust code"
dir = "src-tauri"
run = "cargo fmt --all"

[tasks.format]
description = "Format all code in the UI system"
depends = ["format_node", "format_rust"]

[tasks.test_rust]
depends = ["deps_rust"]
description = "Run unit tests for the Tauri backend"
dir = "src-tauri"
run = "cargo test"

[tasks.test]
description = "Run all available tests for the UI system"
depends = ["test_rust"]

[tasks.start]
depends = ["build"]
description = "Run the compiled UI system application"
run = "./src-tauri/target/release/ui_system"
