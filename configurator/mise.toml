[tools]
uv = "0.9"
prettier = "latest"

[tasks.deps]
description = "Install dependency"
run = "uv sync"
alias = "build"
sources = [
  "pyproject.toml",
  "uv.lock",
]
outputs = { auto = true }


[tasks.lint_python]
depends = ["deps"]
description = "Run Python linter"
run = ["uv run task lint", "uv run task check"]

[tasks.lint_json5]
depends = ["deps"]
description = "Run JSON5 linter"
run = ["prettier --check '**/*.json5'"]

[tasks.lint]
depends = ["lint_json5", "lint_python"]
description = "Run linter"

[tasks.format_python]
depends = ["deps"]
description = "Run Python Formatter"
run = ["uv run task format"]

[tasks.format_json5]
depends = ["deps"]
description = "Run JSON5 Formatter"
run = ["prettier --write '**/*.json5'"]

[tasks.format]
depends = ["format_python", "format_json5"]
description = "Run Formatter"

[tasks.test]
depends = ["deps"]
description = "Run tests"
run = "uv run task test"

[tasks.configurator]
alias = "start"
depends = ["deps"]
description = "Start Application"
run = "uv run python3 src/configurator/main.py"
